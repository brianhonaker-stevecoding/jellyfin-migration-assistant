[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-migration-assistant"
version = "0.3.0"
description = "Validation-first assistant for Windows Jellyfin to Debian/Ubuntu Jellyfin migrations."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Brian Honaker" },
]
keywords = ["jellyfin", "migration", "windows", "linux", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/brianhonaker-stevecoding/jellyfin-migration-assistant"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
jf-migrate = "jellyfin_migration_assistant.cli:main"

[project.gui-scripts]
jellyfin-migration-assistant = "jellyfin_migration_assistant.windows_gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
